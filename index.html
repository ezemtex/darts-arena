<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111916"><meta name="apple-mobile-web-app-title" content="Darts Arena"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Darts Arena</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f1df;background:#101713}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}main{max-width:680px;margin:auto;padding:18px 15px 40px}.top{padding:18px;background:#19251d;border-bottom:2px solid #b69a60;display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:950;letter-spacing:1px}.gold{color:#edca7c}.muted{color:#a4b2a6}.small{font-size:11px;font-weight:800;letter-spacing:1.4px}.panel{background:#202d24;border:1px solid #425347;border-radius:15px;padding:15px;margin-bottom:13px}.grid{display:grid;gap:9px}.choice,.ghost{background:#2b3b30;color:#f6f1df;border:1px solid #536255;border-radius:11px;padding:13px;font-weight:800}.selected{background:#68552f!important;border:2px solid #f0c979!important;color:#ffe4a3!important}.primary{background:#edca7c;color:#241c0c;border:0;border-radius:12px;padding:17px;width:100%;font-weight:950;font-size:16px}.field{width:100%;background:#121d16;color:white;border:1px solid #586959;border-radius:10px;padding:13px;font-size:16px}.score{font-size:clamp(38px,10vw,62px);font-weight:950;line-height:1.2;font-variant-numeric:tabular-nums}.sector{border:2px solid #8d8170;border-radius:11px;min-height:57px;font-size:22px;font-weight:950;box-shadow:inset 0 -4px #0002}.sector:active{transform:scale(.95)}.mode{flex:1;min-width:0;font-size:12px}.slot{flex:1;text-align:center;border:1px dashed #657365;border-radius:11px;padding:10px 3px;min-width:0}.slot strong{display:block;font-size:21px;margin-top:6px}.row{display:flex;gap:8px}.label{margin:20px 0 10px}.status{font-size:12px;color:#e7c77e}.winner{text-align:center;font-size:30px;padding:28px 10px}.error{color:#ff9c9c;font-size:12px;min-height:18px;text-align:center;margin:8px}.activeScore{border:2px solid #e8c77a;background:#383725}.top button{font-size:12px}button:disabled{opacity:.4}

/* iPad landscape dashboard: every scoring control visible without vertical scrolling */
@media (orientation:landscape) and (min-width:800px){
 html,body{width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column}
 .top{flex:0 0 60px;padding:8px max(18px,env(safe-area-inset-right)) 8px max(18px,env(safe-area-inset-left))}
 .logo{font-size:21px}main{max-width:none;width:100%;flex:1;min-height:0;overflow:hidden;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
 main:has(#scores){display:grid;grid-template-columns:minmax(205px,24%) minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 40px;gap:9px 12px}
 main:has(#scores)>div:first-child{grid-column:1/-1;margin:0!important}
 #scores{grid-column:1;grid-row:2;display:flex!important;flex-direction:column;gap:7px!important;min-height:0;overflow:auto;margin:0!important}
 #scores>.panel{flex:1;min-height:0;margin:0!important;padding:8px 12px;display:flex;flex-direction:column;justify-content:center}
 #scores .score{font-size:clamp(28px,5vh,48px);margin:3px 0!important}
 #play{grid-column:2;grid-row:2;min-height:0;display:grid;grid-template-columns:minmax(190px,33%) repeat(2,minmax(0,1fr));grid-template-rows:58px minmax(0,1fr) 80px 72px 52px;gap:7px 12px;align-items:stretch}
 #play>.panel{grid-column:1;grid-row:1/3;margin:0!important;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
 #play>.panel .score{font-size:clamp(28px,5vh,46px)}
 #play>.panel #slots{flex-direction:column!important;margin:8px 0!important;gap:5px}
 #play .slot{display:flex;align-items:center;justify-content:space-between;padding:7px;min-height:0}
 #play .slot strong{font-size:19px;margin:0}
 #play>.label{display:none}
 #modes{grid-column:2/4;grid-row:1;min-height:0}
 #sectors{grid-column:2/4;grid-row:2/4;grid-template-columns:repeat(5,minmax(0,1fr))!important;grid-template-rows:repeat(4,minmax(0,1fr));min-height:0;gap:5px!important}
 #sectors .sector{min-height:0;font-size:clamp(16px,2.7vh,26px);border-radius:8px}
 #special{display:contents}
 #special button{grid-row:5;min-height:0;font-size:clamp(13px,1.5vw,19px)!important;font-weight:900!important;border-width:2px!important;padding:4px!important}
 #special-miss{grid-column:1}
 #special-outer{grid-column:2}
 #special-bull{grid-column:3}
 #confirm{grid-column:2/4;grid-row:4;min-height:44px;padding:8px;font-size:14px}
 #edits{grid-column:1;grid-row:3/5;flex-direction:column;min-height:0;margin:0!important;gap:7px}
 #edits button{min-height:0;padding:8px;font-size:clamp(13px,1.4vw,18px);font-weight:900}
 #play>p{display:none}
 main:has(#scores)>#undo{grid-column:1/-1;grid-row:3;margin:0!important;padding:8px}
 .choice.mode{padding:8px 5px;font-size:clamp(13px,1.4vw,18px);font-weight:900;border-width:2px}
 main:not(:has(#scores)){max-width:820px;margin:auto;overflow:auto;padding:18px}
 main:not(:has(#scores)) .panel{margin-bottom:8px}
}
@media (orientation:landscape) and (min-width:800px) and (max-height:650px){
 .top{flex-basis:48px}.logo{font-size:18px}main{padding-top:6px;padding-bottom:6px}
 main:has(#scores){grid-template-rows:35px minmax(0,1fr) 34px;gap:5px 10px}
 #play{gap:4px 8px;grid-template-rows:48px minmax(0,1fr) 48px 58px 40px}#play>.panel{padding:7px}#play .slot{padding:3px 6px}#scores>.panel{padding:5px 9px}
 #sectors{gap:3px!important}#confirm{min-height:36px}#special button{font-size:13px!important}
}
@media (orientation:portrait) and (min-width:700px){main{max-width:760px}}
</style></head><body><header class="top"><div><div class="logo">🎯 DARTS <span class="gold">ARENA</span></div><div class="small muted">SCOREKEEPER</div></div><span class="small gold" id="state">SETUP</span></header><main id="app"></main>
<script>
const app=document.getElementById('app'),state=document.getElementById('state');
let page=0,count=2,start=501,rule='straight',names=[],scores=[],turn=0,hits=[],mult=1,history=[],winner=-1,custom='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(text,fn,cls='ghost')=>{const b=document.createElement('button');b.className=cls;b.textContent=text;b.onclick=fn;return b};
function setup(){page=0;state.textContent='SETUP';app.innerHTML='<div class="small gold">01 / CONFIGURAZIONE</div><h1>GAME ON. 🎯</h1><p class="muted">Prepara la partita e scegli le regole.</p><div class="small label">QUANTI GIOCATORI?</div><div id="counts" class="grid" style="grid-template-columns:repeat(4,1fr)"></div><div class="small label">PUNTEGGIO INIZIALE</div><div id="starts" class="grid" style="grid-template-columns:repeat(3,1fr)"></div><input id="custom" class="field" type="number" min="1" placeholder="Altro punteggio..." style="margin-top:10px"><div class="small label">CHIUSURA</div><div id="rules" class="row"></div><div style="height:24px"></div><button class="primary" id="next">CONTINUA →</button>';
for(let i=1;i<=8;i++)app.querySelector('#counts').append(button(i,()=>{count=i;custom=app.querySelector('#custom').value;setup()},'choice'+(count===i?' selected':'')));
[301,501,701].forEach(n=>app.querySelector('#starts').append(button(n,()=>{start=n;custom='';setup()},'choice'+(start===n?' selected':''))));
app.querySelector('#custom').value=custom;
[['ZERO ESATTO','straight'],['DOUBLE OUT','double']].forEach(([label,r])=>{const b=button(label,()=>{custom=app.querySelector('#custom').value;rule=r;setup()},'choice'+(rule===r?' selected':''));b.style.flex='1';app.querySelector('#rules').append(b)});
app.querySelector('#next').onclick=()=>{let v=Number(app.querySelector('#custom').value);if(v>0)start=Math.floor(v);nameScreen()}}
function nameScreen(){page=1;state.textContent='PLAYERS';app.innerHTML='<div class="small gold">02 / GIOCATORI</div><h1>CHI GIOCA?</h1><p class="muted">Inserisci i nomi nell’ordine dei turni.</p><div id="fields"></div><button id="go" class="primary">🎯 INIZIA PARTITA</button><button id="back" class="ghost" style="width:100%;margin-top:10px">← INDIETRO</button>';
for(let i=0;i<count;i++){let d=document.createElement('div');d.className='panel';d.innerHTML='<div class="small muted" style="margin-bottom:8px">GIOCATORE '+(i+1)+'</div><input class="field" maxlength="25" placeholder="Nome giocatore" value="'+esc(names[i]||'')+'">';app.querySelector('#fields').append(d)}
app.querySelector('#back').onclick=setup;app.querySelector('#go').onclick=()=>{names=[...app.querySelectorAll('#fields input')].map((x,i)=>x.value.trim()||'Giocatore '+(i+1));scores=Array(count).fill(start);turn=0;hits=[];history=[];winner=-1;mult=1;game()}}
function total(){return hits.reduce((s,h)=>s+h.value,0)}
function add(n,m){if(hits.length===3)return;hits.push({n,m,value:n*m});mult=1;game()}
function game(){page=2;state.textContent=start+' X01';let t=total(),remaining=scores[turn]-t,bust=remaining<0||(rule==='double'&&(remaining===1||(remaining===0&&hits[hits.length-1]?.m!==2)));
app.innerHTML='<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:15px"><div><div class="small gold">LIVE MATCH</div><h2 style="margin:4px 0">'+start+' • '+(rule==='double'?'DOUBLE OUT':'ZERO ESATTO')+'</h2></div><button class="ghost" id="new">↻ NUOVA</button></div><div id="scores" class="grid" style="grid-template-columns:repeat('+ (count===1?1:2)+',minmax(0,1fr));margin-bottom:15px"></div><div id="play"></div><button class="ghost" id="undo" style="width:100%;margin-top:13px">↶ ANNULLA ULTIMO TURNO</button>';
names.forEach((n,i)=>{let d=document.createElement('div');d.className='panel'+(i===turn&&winner<0?' activeScore':'');d.style.minWidth='0';d.innerHTML='<div style="font-size:13px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i===turn&&winner<0?'🎯 ':'')+esc(n)+'</div><div class="score '+(i===turn?'gold':'')+'" style="margin:13px 0">'+scores[i]+'</div><div class="small '+(i===turn?'gold':'muted')+'">'+(winner===i?'🏆 VINCITORE':i===turn&&winner<0?'● AL TIRO':'IN ATTESA')+'</div>';app.querySelector('#scores').append(d)});
app.querySelector('#new').onclick=()=>{if(confirm('Vuoi iniziare una nuova partita?'))setup()};
app.querySelector('#undo').disabled=!history.length;app.querySelector('#undo').onclick=()=>{let h=history.pop();if(h){scores=h.scores;turn=h.turn;winner=-1;hits=[];mult=1;game()}};
let p=app.querySelector('#play');if(winner>=0){p.innerHTML='<div class="panel winner">🏆<h2>'+esc(names[winner])+' VINCE!</h2><button class="primary" id="again">RIVINCITA</button></div>';p.querySelector('#again').onclick=()=>{scores=Array(count).fill(start);turn=0;winner=-1;history=[];hits=[];game()};return}
p.innerHTML='<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="small muted">AL TIRO</div><h2 class="gold" style="margin:5px 0">'+esc(names[turn])+'</h2></div><div style="text-align:right"><div class="small muted">TOTALE TURNO</div><div class="score gold">'+t+'</div></div></div><div class="row" id="slots" style="margin-top:12px"></div><div class="row" style="justify-content:space-between;margin-top:14px"><span class="muted">Punti rimanenti</span><strong id="remain">'+(bust?'BUST':remaining)+'</strong></div></div><div class="small label" style="text-align:center">MOLTIPLICATORE</div><div class="row" id="modes"></div><div id="sectors" class="grid" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:7px"></div><div class="row" id="special" style="margin:12px 0"></div><button id="confirm" class="primary"></button><div class="row" id="edits" style="margin-top:10px"></div><p class="muted" style="text-align:center;font-size:12px">Massimo 3 freccette per turno</p>';
p.querySelector('#remain').style.color=bust?'#ff8b8b':'#89e6ad';
for(let i=0;i<3;i++){let h=hits[i],d=document.createElement('div');d.className='slot';d.innerHTML='<div class="small muted">FRECCETTA '+(i+1)+'</div><strong>'+(h?(h.n===25?(h.m===2?'BULL':'25'):(h.m===3?'T':h.m===2?'D':'')+h.n):'—')+'</strong><div class="gold" style="font-size:12px">'+(h?'+'+h.value:'&nbsp;')+'</div>';p.querySelector('#slots').append(d)}
[['SINGOLO',1],['DOPPIO ×2',2],['TRIPLO ×3',3]].forEach(([label,m])=>p.querySelector('#modes').append(button(label,()=>{mult=m;game()},'choice mode'+(mult===m?' selected':''))));
const red=new Set([20,18,13,10,2,3,7,8,14,12]);for(let n=1;n<=20;n++){let b=button(n,()=>add(n,mult),'sector');b.style.background=red.has(n)?'#b9323c':'#ead9b8';b.style.color=red.has(n)?'#fff':'#24261d';b.disabled=hits.length===3;p.querySelector('#sectors').append(b)}
[['MISS 0',()=>add(0,1),'#3b4940','miss'],['OUTER BULL 25',()=>add(25,1),'#208454','outer'],['BULLSEYE 50',()=>add(25,2),'#bd333e','bull']].forEach(([label,fn,color,id])=>{let b=button(label,fn,'sector');b.id='special-'+id;b.style.cssText='flex:1;min-width:0;background:'+color+';color:white;padding:8px 4px';b.disabled=hits.length===3;p.querySelector('#special').append(b)});
p.querySelector('#confirm').textContent=bust?'BUST — PASSA TURNO →':remaining===0?'🏆 CHIUDI PARTITA →':'CONFERMA '+t+' PUNTI →';
p.querySelector('#confirm').onclick=()=>{history.push({scores:[...scores],turn});if(!bust){scores[turn]=remaining;if(remaining===0)winner=turn}if(winner<0)turn=(turn+1)%count;hits=[];mult=1;game()};
let rem=button('⌫ ULTIMA FRECCETTA',()=>{hits.pop();game()});rem.style.flex='1';let clear=button('✕ AZZERA TIRO',()=>{hits=[];game()});clear.style.flex='1';p.querySelector('#edits').append(rem,clear)}
function saveState(){try{localStorage.setItem('darts-arena-v1',JSON.stringify({page,count,start,rule,names,scores,turn,hits,mult,history,winner,custom}))}catch(e){}}
function restoreState(){try{let s=JSON.parse(localStorage.getItem('darts-arena-v1'));if(!s)return false;count=s.count||2;start=s.start||501;rule=s.rule||'straight';names=Array.isArray(s.names)?s.names:[];scores=Array.isArray(s.scores)?s.scores:[];turn=s.turn||0;hits=Array.isArray(s.hits)?s.hits:[];mult=s.mult||1;history=Array.isArray(s.history)?s.history:[];winner=typeof s.winner==='number'?s.winner:-1;custom=s.custom||'';if(s.page===2&&scores.length===count){game();return true}if(s.page===1){nameScreen();return true}return false}catch(e){return false}}
document.addEventListener('click',()=>setTimeout(saveState,0),true);
document.addEventListener('input',()=>setTimeout(saveState,0),true);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script><script src="./profiles.js"></script><script src="./duels.js"></script><script src="./three.min.js"></script><script src="./cinema.js"></script></body></html>
